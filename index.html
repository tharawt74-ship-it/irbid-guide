        /* Modern initial loader styling to prevent the ugly white screen on refresh */
        .splash-container {
          position: fixed;

          bottom: 0;

          display: flex;
          flex-direction: column;

          align-items: center;
          justify-content: center;
          gap: 1.25rem;
          text-align: center;
        }

          display: flex;
          align-items: center;
          justify-content: center;

          color: #f3f4f6;
          border: 1px solid #e5e7eb;
          z-index: 1;
        }

        /* Colored Brand Layer (reveals over the silver layer) */
        .logo-colored {
          background: linear-gradient(135deg, #1a4d2e 0%, #133b22 100%);
          color: #ff9f1c; /* Gold color store icon */
          border: 1px solid rgba(26, 77, 46, 0.25);
          z-index: 2;
          overflow: hidden;
          clip-path: inset(100% 0% 0% 0%);
          animation: fillUpLogo 1.8s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        /* Dual-layer Text */
        .text-container {
          position: relative;
          height: 36px;
          width: 200px;
          display: flex;
          align-items: center;
          justify-content: center;
        }

        .brand-title {
          font-size: 24px;
          font-weight: 900;
          letter-spacing: -0.02em;
          white-space: nowrap;
          line-height: 1;
          font-family: inherit;
        }

          background: linear-gradient(180deg, #9ca3af 0%, #6b7280 100%);
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
          z-index: 1;
        }

          top: 0;
          left: 0;
          right: 0;
          bottom: 0;
          color: #1a4d2e;
          background: linear-gradient(180deg, #1a4d2e 0%, #133b22 100%);
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
          z-index: 2;
          clip-path: inset(100% 0% 0% 0%);
          animation: fillUpLogo 1.8s cubic-bezier(0.4, 0, 0.2, 1) forwards;
          animation-delay: 0.15s;
        }

        .brand-subtitle {
          font-size: 11px;

          opacity: 0;
          animation: revealFadeIn 1.2s ease-out 0.8s forwards;
          direction: rtl;
        }

        /* Soft ambient backdrop glow */
        .bg-glow {
          position: absolute;
          width: 260px;
          height: 260px;
          background: radial-gradient(circle, rgba(26, 77, 46, 0.04) 0%, rgba(26, 77, 46, 0) 70%);
          border-radius: 50%;
          z-index: 0;
          animation: subtlePulse 2.2s ease-in-out infinite alternate;
        }

        /* Interactive loading/filling animations */
        @keyframes fillUpLogo {
          0% {
            clip-path: inset(100% 0% 0% 0%);
          }
          100% {
            clip-path: inset(0% 0% 0% 0%);
          }
        }

        @keyframes revealFadeIn {
          0% {
            opacity: 0;
            transform: translateY(5px);
          }
          100% {
            opacity: 1;
            transform: translateY(0);
          }
        }

        @keyframes subtlePulse {
          0% {
            transform: scale(0.92);
            opacity: 0.4;
          }
          100% {
            transform: scale(1.08);
            opacity: 1.0;
          }
